appId: com.android.settings
name: "TC04 - Enter Name and Navigate to Home"
tags:
  - onboarding
  - regression
---
- setLocation:
    latitude: 0.4717
    longitude: 35.9650
- extendedWaitUntil:
    visible:
      id: "language_screen"
    timeout: 30000
- tapOn:
    id: "language_item_${LANGUAGE_CODE}"
- waitForAnimationToEnd
- tapOn:
    id: "language_start_button"
- waitForAnimationToEnd

- runFlow:
    when:
      visible:
        id: "language_start_button"
    commands:
      - tapOn:
          id: "language_start_button"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "name_screen"
    timeout: 20000
    optional: true

- runFlow:
    when:
      visible:
        id: "name_screen"
    commands:
      - tapOn:
          id: "name_input"
      - longPressOn:
          id: "name_input"
      - runFlow:
          when:
            visible:
              text: "Select all"
          commands:
            - tapOn: "Select all"
      - eraseText: 1
      - inputText: ${USER_NAME}
      - hideKeyboard
      - tapOn:
          id: "name_save_button"

- runFlow:
    when:
      visible:
        id: "location_interstitial_screen"
    commands:
      - tapOn:
          id: "location_interstitial_skip"
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 30000
- assertVisible:
    id: "home_type_button"

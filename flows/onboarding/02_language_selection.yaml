appId: com.android.settings
name: "TC02 - Language Selection and Navigate Forward"
tags:
  - onboarding
  - smoke
---
    
- setLocation:
    latitude: 0.4717
    longitude: 35.9650
- extendedWaitUntil:
    visible:
      id: "language_screen"
    timeout: 30000
- assertVisible:
    id: "language_item_${LANGUAGE_CODE}"
- tapOn:
    id: "language_start_button"
- extendedWaitUntil:
    visible:
      id: "name_screen"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: "name_screen"
    commands:
      - assertVisible:
          id: "name_save_button"
- runFlow:
    when:
      visible:
        id: "home_screen"
    commands:
      - assertVisible:
          id: "home_screen"

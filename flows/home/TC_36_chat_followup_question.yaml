appId: ${APP_ID}
name: "TC36 - Chat Follow-up via Suggested Question Tap"
# priority: P0
# description: Verifies the suggested-question follow-up flow: sends an initial typed question, waits for the first AI answer to render with its suggested-questions block, taps the first suggested-question chip, and confirms a second AI answer renders with its own suggested-questions block.
tags:
  - chat
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

# ── First question ──
- tapOn:
    id: "primary_input_type_btn"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "chat_text_input"
    timeout: 5000
- tapOn:
    id: "chat_text_input"
- inputText: "How to grow maize"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "chat_send_btn"
    timeout: 5000
- tapOn:
    id: "chat_send_btn"

- scrollUntilVisible:
    centerElement: true
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 90000
    speed: 40
- assertVisible:
    id: "chat_suggested_questions"

# ── Follow-up: tap the first suggested question (not retype) ──
# The chat view replaces (not appends) on each turn — chat_suggested_question_*
# ids reset to _0/_1/_2 for the new answer. Without the notVisible gate
# below, the subsequent scrollUntilVisible could match the OLD block
# before Compose tears it down and pass instantly. (Same race we
# documented in TC06.)
- tapOn:
    id: "chat_suggested_question_0"
- extendedWaitUntil:
    notVisible:
      id: "chat_suggested_questions"
    timeout: 5000

# ── Wait for the follow-up answer ──
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 90000
    speed: 40
- assertVisible:
    id: "chat_suggested_questions"

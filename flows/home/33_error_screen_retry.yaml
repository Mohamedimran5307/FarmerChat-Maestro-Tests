appId: ${APP_ID}
name: "TC33 - No-Internet Error: Retry Recovers to Language Screen"
# priority: P2
# description: Taps Retry on the global no-internet error screen and verifies the app proceeds to the language screen (fresh-install path) once connectivity is restored
# Precondition: network connectivity must be RESTORED before this
# test runs. Sequence:
#   1) Disable network on device.
#   2) Run TC33_error_screen_assert (verifies the error appears).
#   3) Re-enable network.
#   4) Run THIS test (verifies retry recovers).
tags:
  - error
  - regression
---
- tapOn:
    id: "error_retry_button"
- extendedWaitUntil:
    visible:
      id: "language_screen"
    timeout: 30000
- assertVisible:
    id: "language_screen"

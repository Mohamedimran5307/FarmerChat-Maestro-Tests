appId: ${APP_ID}
name: "TC_10 - Share AI Response via System Chooser"
# priority: P1
# description: Verifies the Share action on an AI answer: sends a typed question, waits for the answer to fully render (suggestions visible), taps the action-row Share button, and confirms that the Android share chooser opens.
# TODO: chat_share_btn / chat_save_btn lost their testTags on some
# builds of the new APK (we saw chat_listen_btn surviving but the
# other two missing during TC02 work). If this test starts failing on
# the chat_share_btn lookup, the action-row testTags are gone — fall
# back to a text:"Share" matcher or escalate to the app team.
tags:
  - home
  - chat
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

# Open the type input and send a question
- tapOn:
    id: "primary_input_type_btn"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "chat_text_input"
    timeout: 5000
- tapOn:
    id: "chat_text_input"
- inputText: "How to prevent maize rust disease"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "chat_send_btn"
    timeout: 5000
- tapOn:
    id: "chat_send_btn"

# Wait for the answer-complete signal (suggestions block renders last).
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 90000
    speed: 40

# Scroll up to the action row to bring chat_share_btn into a tappable position.
- scrollUntilVisible:
    centerElement: true
    element:
      id: "chat_share_btn"
    direction: UP
    timeout: 10000
- tapOn:
    id: "chat_share_btn"

# Android share chooser opens. Verify the system chooser surface
# regardless of which share targets the device exposes.
- extendedWaitUntil:
    visible:
      id: "android:id/chooser_header"
    timeout: 15000
- assertVisible:
    id: "android:id/chooser_header"

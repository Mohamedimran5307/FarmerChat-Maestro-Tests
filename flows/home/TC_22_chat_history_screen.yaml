appId: ${APP_ID}
name: "TC22 - Drawer \"See All\" Opens Chat History Screen"
# priority: P1
# description: Verifies the chat history screen via the drawer's 'See all' entry: signs up, seeds chat history with a question, returns home, opens the drawer, opens chat history, and confirms the seeded conversation is listed; then taps the entry to reopen the conversation.
# TODO: drawer_see_all_button / chat_history_screen / chat_history_list
# testTags carry over from the old APK and need a live-device check.
tags:
  - home
  - chat
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

# ── Sign up ──
- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_signup_btn"
    timeout: 5000
- tapOn:
    id: "drawer_signup_btn"

- runFlow:
    when:
      visible:
        id: "account_benefits_btn_signup"
    commands:
      - tapOn:
          id: "account_benefits_btn_signup"

- extendedWaitUntil:
    visible:
      id: "auth_phone_input"
    timeout: 10000
- tapOn:
    id: "auth_phone_input"
- inputText: "${PHONE_NUMBER}"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "auth_send_sms_btn"
    timeout: 5000
- tapOn:
    id: "auth_send_sms_btn"

- extendedWaitUntil:
    visible:
      id: "auth_otp_input"
    timeout: 30000
- tapOn:
    id: "auth_otp_input"
- inputText: "${OTP_CODE}"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "auth_verify_btn"
    timeout: 5000
- tapOn:
    id: "auth_verify_btn"

- extendedWaitUntil:
    visible:
      id: "account_success_screen"
    timeout: 30000
- tapOn:
    id: "account_success_btn_continue"
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000

# ── Ask a question to seed history ──
- tapOn:
    id: "primary_input_type_btn"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "chat_text_input"
    timeout: 5000
- tapOn:
    id: "chat_text_input"
- inputText: "How to grow maize"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "chat_send_btn"
    timeout: 5000
- tapOn:
    id: "chat_send_btn"

- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 90000
    speed: 40

# ── Close chat → back to home ──
- tapOn:
    id: "appbar_logo_left_btn"
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000

# ── Drawer → See all (Chat History) ──
- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- extendedWaitUntil:
    visible:
      id: "drawer_see_all_button"
    timeout: 10000
- tapOn:
    id: "drawer_see_all_button"

- extendedWaitUntil:
    visible:
      id: "chat_history_screen"
    timeout: 15000
- assertVisible:
    id: "chat_history_list"

# ── Tap the seeded conversation ──
- tapOn:
    text: ".*maize.*"
    index: 0
- extendedWaitUntil:
    visible:
      text: "How to grow maize"
    timeout: 30000
- assertVisible:
    text: "How to grow maize"

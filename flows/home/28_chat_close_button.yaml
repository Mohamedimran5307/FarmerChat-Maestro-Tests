appId: ${APP_ID}
name: "TC28 - Chat (X) Close Returns to Home"
# priority: P1
# description: Sends a typed question, waits for the AI answer, taps the chat appbar's X (close) button, and verifies the user is back on home_screen
tags:
  - chat
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- tapOn:
    id: "primary_input_type_btn"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "chat_text_input"
    timeout: 5000
- tapOn:
    id: "chat_text_input"
- inputText: "How to irrigate rice fields"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "chat_send_btn"
    timeout: 5000
- tapOn:
    id: "chat_send_btn"

# Wait for the answer to render (suggestions are the end-of-stream signal)
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 90000
    speed: 40

# Tap the appbar X — appbar_logo_left_btn replaces the old chat_close_button.
- tapOn:
    id: "appbar_logo_left_btn"

- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000
- assertVisible:
    id: "home_screen"

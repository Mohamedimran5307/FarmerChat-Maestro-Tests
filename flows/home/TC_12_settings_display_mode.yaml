appId: ${APP_ID}
name: "TC_12 - Settings: Toggle Display Mode (Day / Night / Auto)"
# priority: P2
# description: Verifies the appearance setting in the Settings screen: cycles through the three modes (Day / Night / Auto) and confirms each toggle updates the active-mode descriptor text correctly.
tags:
  - settings
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

# Open drawer → Settings
- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_settings_btn"
    timeout: 5000
- tapOn:
    id: "drawer_settings_btn"
- extendedWaitUntil:
    visible:
      id: "settings_screen"
    timeout: 5000

# Cycle through the three appearance modes and verify each label.
# The label strings carry over from the old APK and need a live-device
# verification after first run.
- tapOn:
    id: "settings_btn_appearance_day"
- assertVisible:
    text: ".*always in light mode.*"

- tapOn:
    id: "settings_btn_appearance_night"
- assertVisible:
    text: ".*always in dark mode.*"

- tapOn:
    id: "settings_btn_appearance_auto"
- assertVisible:
    text: ".*adjusts with your phone settings.*"

appId: ${APP_ID}
name: "TC31 - Chat Offline: Inline Error + Retry Recovers"
# priority: P2
# description: Self-contained inline chat-error test. Onboards online and lands on home, goes offline (airplane mode), sends a chat question and asserts the inline error + retry button, then restores network, taps retry, and confirms the AI answer renders. Network toggling is driven entirely by Maestro (setAirplaneMode) — no manual intervention.
tags:
  - chat
  - error
  - regression
---
# Ensure online, then onboard so we reach home_screen with a working session.
- setAirplaneMode: disabled
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml
- assertVisible:
    id: "home_screen"

# Go offline, then send a question → inline chat error ("Something went wrong"
# with a retry button) inside chat_screen, not the global error screen.
- setAirplaneMode: enabled
- runFlow:
    file: ../../helpers/compose_typed_question.yaml
    env:
      QUESTION_TEXT: "How to grow maize"
- extendedWaitUntil:
    visible:
      id: "chat_retry_btn"
    timeout: 60000
- assertVisible:
    id: "chat_screen"

# Restore network and retry until the AI answer renders. Wi-Fi/data take a few
# seconds to reassociate, so re-tap only while the retry button is still showing.
- setAirplaneMode: disabled
- retry:
    maxRetries: 5
    commands:
      - runFlow:
          when:
            visible:
              id: "chat_retry_btn"
          commands:
            - tapOn:
                id: "chat_retry_btn"
      - scrollUntilVisible:
          centerElement: false
          element:
            id: "chat_suggested_questions"
          direction: DOWN
          timeout: 90000
          speed: 40
- assertVisible:
    id: "chat_suggested_questions"
appId: org.digitalgreen.farmer.chat
name: "TC23 - Save AI Response Shows Confirmation"
# priority: P2
# description: Verifies the Save action on an AI answer: sends a typed question, waits for the answer to fully render, taps the action-row Save button, and confirms a 'saved' confirmation toast / banner appears.
# TODO: chat_save_btn lost its testTag on some new-APK builds. If the
# lookup starts timing out, fall back to a text:"Save" matcher or
# escalate to the app team. The success message text (".*[Ss]aved.*")
# was inherited from the old APK and needs a live-device check.
tags:
  - chat
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml
- runFlow:
    file: ../../helpers/compose_typed_question.yaml
    env:
      QUESTION_TEXT: "Best fertilizer for tomato farming"

# Wait for the answer to fully render (suggestions appear last).
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 90000
    speed: 40

# Scroll back up to the action row and tap Save.
- scrollUntilVisible:
    centerElement: true
    element:
      id: "chat_save_btn"
    direction: UP
    timeout: 10000
- tapOn:
    id: "chat_save_btn"

# Confirm a "saved" toast / banner appears.
- extendedWaitUntil:
    visible:
      text: ".*[Ss]aved.*"
    timeout: 10000
- assertVisible:
    text: ".*[Ss]aved.*"

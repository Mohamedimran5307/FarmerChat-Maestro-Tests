appId: ${APP_ID}
name: "TC09 - Photo Question from Gallery → AI Response"
# priority: P1
# description: Verifies the photo-based chat flow via the system gallery picker: taps the Photo input button, picks the Photos tab and selects an image, sends it as a chat question, and confirms an AI answer renders with its suggested-questions block.
# TODO: The system gallery picker UI on the new APK has not yet been
# inspected — the text matchers below ("Photos", "Photo taken on.*",
# "Dismiss") may need adjustment after first live run. Open the picker
# manually and inspect to capture the correct selectors.
tags:
  - home
  - chat
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

# Tap the Photo input button (new APK testTag).
- tapOn:
    id: "primary_input_photo_btn"

# The system photo picker opens. Pick the "Photos" tab if Android shows
# the album view first.
- runFlow:
    when:
      visible:
        text: "Photos"
    commands:
      - tapOn: "Photos"

# Dismiss any first-time picker walkthrough if the OS shows one.
- runFlow:
    when:
      visible:
        text: "Dismiss"
    commands:
      - tapOn: "Dismiss"

# Tap the first photo in the gallery. "Photo taken on..." is the
# default accessibility label Android uses for photo thumbnails.
- extendedWaitUntil:
    visible:
      text: "Photo taken on.*"
    timeout: 15000
- tapOn:
    text: "Photo taken on.*"

# Back in the app's chat composer with the photo attached. The send
# button uses the new chat_send_btn testTag.
- extendedWaitUntil:
    visible:
      id: "chat_send_btn"
    timeout: 10000
- tapOn:
    id: "chat_send_btn"

# Wait for the AI answer. chat_suggested_questions appears only after
# the answer fully streams in — same end-of-stream signal we use in TC06.
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 90000
    speed: 40
- assertVisible:
    id: "chat_suggested_questions"

appId: org.digitalgreen.farmer.chat
name: "TC28 - Drawer \"Past Advice\" Lists Recent Chats"
# priority: P1
# description: Verifies the drawer's recent-chat list: signs up, seeds chat history with a 'wheat' question, returns home, opens the drawer, confirms the seeded conversation appears under 'Past Advice', then taps the entry to reopen the conversation in full.
# TODO: "Past Advice" section header carries over from the old APK
# (no confirmed testTag). The new APK may use a stable id like
# drawer_past_advice_section or drawer_chat_history_item — replace
# the text matcher after a live inspection.
tags:
  - drawer
  - chat
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml
- runFlow: ../../helpers/full_signup.yaml

# ── Ask a question to seed chat history ──
- runFlow:
    file: ../../helpers/compose_typed_question.yaml
    env:
      QUESTION_TEXT: "How to control pests in wheat"

- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 90000
    speed: 40

# ── Close chat → back to home ──
- tapOn:
    id: "appbar_logo_left_btn"
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000

# ── Open drawer and verify the seeded chat appears under Past Advice ──
- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- extendedWaitUntil:
    visible:
      text: "Past Advice"
    timeout: 10000
- assertVisible:
    text: ".*wheat.*"

# ── Tap the recent chat item to reopen it ──
- tapOn:
    text: ".*wheat.*"
    index: 0

- extendedWaitUntil:
    visible:
      text: "How to control pests in wheat"
    timeout: 30000
- assertVisible:
    text: "How to control pests in wheat"

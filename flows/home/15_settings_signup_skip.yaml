appId: com.android.settings
name: "TC18 - Settings Sign Up Skip"
tags:
  - settings
  - auth
  - regression
---
- runFlow: ../../helpers/complete_onboarding.yaml

- tapOn:
    id: "home_hamburger_button"
- extendedWaitUntil:
    visible:
      id: "drawer_settings_button"
    timeout: 5000
- tapOn:
    id: "drawer_settings_button"
- extendedWaitUntil:
    visible:
      id: "settings_screen"
    timeout: 5000

- tapOn:
    id: "settings_signup_button"
- extendedWaitUntil:
    visible:
      text: "Sign up with phone number"
    timeout: 10000

- tapOn: "Skip"
- extendedWaitUntil:
    visible:
      id: "settings_screen"
    timeout: 5000

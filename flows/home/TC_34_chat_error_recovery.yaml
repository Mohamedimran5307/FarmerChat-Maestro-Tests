appId: ${APP_ID}
name: "TC34 - Chat Inline Error: Retry Recovers After Reconnect"
# priority: P2
# description: Verifies recovery from the inline chat error: with network restored, taps the inline retry button on the chat screen and confirms the AI answer renders with its suggested-questions block.
# Precondition: network connectivity must be RESTORED before this
# test runs, and the chat screen must already be showing
# chat_inline_error / chat_inline_retry_button (from
# TC34_chat_error_offline). See TC34_chat_error_onboarding for the
# full sequence.
tags:
  - chat
  - error
  - regression
---
- tapOn:
    id: "chat_inline_retry_button"

# Wait for the answer to render (chat_suggested_questions is the new
# end-of-stream signal — was chat_thread_list on the old APK).
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 90000
    speed: 40
- assertVisible:
    id: "chat_suggested_questions"

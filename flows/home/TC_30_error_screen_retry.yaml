appId: ${APP_ID}
name: "TC30 - No-Internet Error: Retry Recovers to Language Screen"
# priority: P2
# description: Verifies recovery from the global no-internet error: with network restored, taps the retry button and confirms the app proceeds to the first-launch language screen. Precondition: the error screen must already be visible (run TC_29 assert first while offline, then re-enable network).
# Precondition: network connectivity must be RESTORED before this
# test runs. Sequence:
#   1) Disable network on device.
#   2) Run TC_29_error_screen_assert (verifies the error appears).
#   3) Re-enable network.
#   4) Run THIS test (verifies retry recovers).
tags:
  - error
  - regression
---
- tapOn:
    id: "error_retry_button"
- extendedWaitUntil:
    visible:
      id: "language_screen"
    timeout: 30000
- assertVisible:
    id: "language_screen"

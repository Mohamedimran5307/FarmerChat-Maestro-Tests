appId: ${APP_ID}
name: "TC30 - No-Internet Error: Retry Recovers to Language Screen"
# priority: P2
# description: Self-contained recovery test for the global no-internet error. Enables airplane mode, cold-starts the app to surface the error screen, then disables airplane mode and taps retry until the app recovers to the first-launch language screen. Network toggling is driven entirely by Maestro (setAirplaneMode) — no manual intervention.
tags:
  - error
  - regression
---
# Go fully offline, then cold-start so the launch hits the global no-internet error.
- setAirplaneMode: enabled
# - clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: "error_screen"
    timeout: 30000
- assertVisible:
    id: "error_btn_try_again"

# Restore connectivity. Wi-Fi/data take a few seconds to reassociate after
# airplane mode is turned off, so the first "Try again" tap can fire before the
# network is back. Re-tap only while the error button is still showing, and wait
# generously for the language screen to load between attempts.
- setAirplaneMode: disabled
- retry:
    maxRetries: 5
    commands:
      - runFlow:
          when:
            visible:
              id: "error_btn_try_again"
          commands:
            - tapOn:
                id: "error_btn_try_again"
      - extendedWaitUntil:
          visible:
            id: "language_screen"
          timeout: 15000
# Final settle: extendedWaitUntil polls (unlike a bare assertVisible, which can
# catch a flicker mid-reconnect), so it serves as the recovery assertion.
- extendedWaitUntil:
    visible:
      id: "language_screen"
    timeout: 20000

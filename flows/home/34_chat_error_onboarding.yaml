appId: ${APP_ID}
name: "TC34 - Onboard to Home (Offline-Error Setup)"
# priority: P2
# description: Setup step for the TC34 chat-offline-error sequence — onboards the app and lands on home_screen so the operator can disable network and run TC34_chat_error_offline next
# Precondition: device ONLINE while this runs. Sequence:
#   1) Run THIS test (lands on home_screen).
#   2) Disable network on device.
#   3) Run TC34_chat_error_offline (verifies inline error appears).
#   4) Re-enable network.
#   5) Run TC34_chat_error_recovery (verifies retry recovers).
tags:
  - chat
  - error
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml
- assertVisible:
    id: "home_screen"

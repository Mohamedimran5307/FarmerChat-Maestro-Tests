appId: ${APP_ID}
name: "TC26 - Save an AI Response (Toast / Saved Confirmation)"
# priority: P2
# description: Sends a typed question, waits for the AI answer, taps Save on the answer's action row, and verifies a "saved" confirmation appears
# TODO: chat_save_btn lost its testTag on some new-APK builds (see
# the same note in TC10_share_ai_response). If the lookup starts
# timing out, fall back to a text:"Save" matcher or escalate to the
# app team. The success message text (".*[Ss]aved.*") was inherited
# from the old APK and needs a live-device check.
tags:
  - chat
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- tapOn:
    id: "primary_input_type_btn"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "chat_text_input"
    timeout: 5000
- tapOn:
    id: "chat_text_input"
- inputText: "Best fertilizer for tomato farming"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "chat_send_btn"
    timeout: 5000
- tapOn:
    id: "chat_send_btn"

# Wait for the answer to fully render (suggestions appear last).
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 90000
    speed: 40

# Scroll back up to the action row and tap Save.
- scrollUntilVisible:
    centerElement: true
    element:
      id: "chat_save_btn"
    direction: UP
    timeout: 10000
- tapOn:
    id: "chat_save_btn"

# Confirm a "saved" toast/banner appears.
- extendedWaitUntil:
    visible:
      text: ".*[Ss]aved.*"
    timeout: 10000
- assertVisible:
    text: ".*[Ss]aved.*"

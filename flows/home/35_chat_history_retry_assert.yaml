appId: com.android.settings
name: "TC35 - Chat History Retry Assert"
tags:
  - chat
  - error
  - regression
---
# Navigate to chat history (offline) - global error screen appears
- tapOn:
    id: "home_hamburger_button"
- extendedWaitUntil:
    visible:
      id: "drawer_see_all_button"
    timeout: 5000
- tapOn:
    id: "drawer_see_all_button"

# Assert global error screen appears
- extendedWaitUntil:
    visible:
      id: "error_screen"
    timeout: 30000
- assertVisible:
    id: "error_retry_button"

appId: ${APP_ID}
name: "TC35 - Chat History Offline: Global Error Screen Asserts"
# priority: P2
# description: After signing in + seeding history (TC35_setup) and disabling network, opens the drawer's See-all entry and verifies the global no-internet error screen appears with its retry button
# Precondition: TC35_chat_history_retry_setup has run while online,
# and the device is now OFFLINE on home_screen. See setup for the
# full sequence.
tags:
  - chat
  - error
  - regression
---
- tapOn:
    id: "home_hamburger_button"
- extendedWaitUntil:
    visible:
      id: "drawer_see_all_button"
    timeout: 5000
- tapOn:
    id: "drawer_see_all_button"

- extendedWaitUntil:
    visible:
      id: "error_screen"
    timeout: 30000
- assertVisible:
    id: "error_retry_button"

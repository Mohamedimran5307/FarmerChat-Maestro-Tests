appId: ${APP_ID}
name: "TC29 - No-Internet Error Screen Asserts on Cold Start"
# priority: P2
# description: Verifies the global no-internet error screen on a cold start while offline: launches the app and confirms the error screen with its retry button renders. Precondition: device must be offline before this test runs.
# Precondition: device must be OFFLINE before this test runs. The
# runner does NOT toggle airplane mode — the operator is expected to
# disable network manually, run this test, then re-enable network
# and run TC_30_error_screen_retry.
# TODO: error_screen / error_retry_button testTags carry over from
# the old APK; the new build may use error_btn_retry or similar.
tags:
  - error
  - regression
---
# - launchApp

- extendedWaitUntil:
    visible:
      id: "error_screen"
    timeout: 30000
- assertVisible:
    id: "error_retry_button"

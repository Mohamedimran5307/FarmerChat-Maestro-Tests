appId: ${APP_ID}
name: "TC10 - Crops Card Renders After Sign-Up + Location"
# priority: P1
# description: Signs up via phone OTP, grants location via the weather widget, and verifies a "crops do you grow" profile-prompt card renders on the home feed
tags:
  - home
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

# ── Sign up via drawer → phone → OTP ──
# home_hamburger_button unmounts when the feed scrolls, so retry-scroll
# back to it before tapping (same pattern as TC25).
- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_signup_btn"
    timeout: 5000
- tapOn:
    id: "drawer_signup_btn"

# Some builds insert an intermediate "account benefits" sign-up step.
- runFlow:
    when:
      visible:
        id: "account_benefits_btn_signup"
    commands:
      - tapOn:
          id: "account_benefits_btn_signup"

- extendedWaitUntil:
    visible:
      id: "auth_phone_input"
    timeout: 10000
- tapOn:
    id: "auth_phone_input"
- eraseText: 20
- inputText: "${NEW_PHONE_NUMBER}"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "auth_send_sms_btn"
    timeout: 5000
- tapOn:
    id: "auth_send_sms_btn"

- extendedWaitUntil:
    visible:
      id: "auth_otp_input"
    timeout: 30000
- tapOn:
    id: "auth_otp_input"
- inputText: "${OTP_CODE}"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "auth_verify_btn"
    timeout: 5000
- tapOn:
    id: "auth_verify_btn"

- extendedWaitUntil:
    visible:
      id: "account_success_screen"
    timeout: 30000
- tapOn:
    id: "account_success_btn_continue"
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000

# ── Grant location via the weather widget and return to home ──
- runFlow: ../../helpers/weather_share_location_and_back_home.yaml

# ── Assert the crops question card renders on the feed ──
# This card is served by Firebase remote config; if the flag is off the
# card never appears and this assertion will fail loudly — that's
# intentional, the whole point of this TC.
- extendedWaitUntil:
    visible:
      id: "home_feed_list"
    timeout: 15000
- scrollUntilVisible:
    centerElement: true
    element:
      text: ".*crops do you grow.*"
    direction: DOWN
    timeout: 60000
    speed: 40
- assertVisible:
    text: ".*crops do you grow.*"

appId: org.digitalgreen.farmer.chat  #${APP_ID}
name: "TC05 - Gender Card Renders After Sign-Up + Location"
# priority: P1
# description: End-to-end sign-up + profile-card test: completes the drawer-initiated phone+OTP sign-up flow, grants location via the weather widget, returns home, and confirms that all four options on the gender profile-prompt card (Female / Male / Other / Prefer not to say) render on the home feed.
tags:
  - home
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

# ── Sign up via drawer → phone → OTP ──
- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_signup_btn"
    timeout: 5000
- tapOn:
    id: "drawer_signup_btn"

- runFlow:
    when:
      visible:
        id: "account_benefits_btn_signup"
    commands:
      - tapOn:
          id: "account_benefits_btn_signup"

- extendedWaitUntil:
    visible:
      id: "auth_phone_input"
    timeout: 10000
- tapOn:
    id: "auth_phone_input"
- eraseText: 20
- inputText: "${PHONE_NUMBER}"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "auth_send_sms_btn"
    timeout: 5000
- tapOn:
    id: "auth_send_sms_btn"

- extendedWaitUntil:
    visible:
      id: "auth_otp_input"
    timeout: 30000
- tapOn:
    id: "auth_otp_input"
- inputText: "${OTP_CODE}"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "auth_verify_btn"
    timeout: 5000
- tapOn:
    id: "auth_verify_btn"

- extendedWaitUntil:
    visible:
      id: "account_success_screen"
    timeout: 30000
- tapOn:
    id: "account_success_btn_continue"
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000

# ── Grant location via the weather widget and return to home ──
- runFlow: ../../helpers/weather_share_location_and_back_home.yaml

# ── Assert the gender card and its four options are visible ──
# The gender card is Firebase-flag gated — if the flag is off the card
# never appears and this assertion fails. That's intentional, this TC's
# entire purpose is to verify the gender card is rendered.
- extendedWaitUntil:
    visible:
      id: "home_feed_list"
    timeout: 15000
- scrollUntilVisible:
    centerElement: true
    element:
      id: "home_feed_card_gender"
    direction: DOWN
    timeout: 60000
    speed: 40
- assertVisible:
    id: "home_feed_card_gender"
# All four select-option rows must be present.
- assertVisible:
    id: "single_select_card_option_0"
- assertVisible:
    id: "single_select_card_option_1"
- assertVisible:
    id: "single_select_card_option_2"
- assertVisible:
    id: "single_select_card_option_3"

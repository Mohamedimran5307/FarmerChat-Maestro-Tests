appId: ${APP_ID}
name: "TC_20 - Drawer: Change Language"
# priority: P2
# description: Validates the language-change flow from the drawer: opens the language chooser, selects the configured language, saves, and confirms a language-updated confirmation message appears.
# TODO: language_chooser_screen and language_chooser_save_button
# testTags carry over from the old APK; the new APK may use the same
# language_screen / language_start_button ids the first-launch flow
# uses, or new ones. Inspect after first run.
tags:
  - navigation
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_language_btn"
    timeout: 5000
- tapOn:
    id: "drawer_language_btn"

- extendedWaitUntil:
    visible:
      id: "language_chooser_screen"
    timeout: 5000

- tapOn: "${LANGUAGE}"
- tapOn:
    id: "language_chooser_save_button"

- extendedWaitUntil:
    visible:
      text: ".*language.*updated.*"
    timeout: 10000

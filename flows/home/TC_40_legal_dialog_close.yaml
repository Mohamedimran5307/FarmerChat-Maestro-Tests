appId: ${APP_ID}
name: "TC40 - First-Launch: Verify Both Legal Links in Language-Screen Legal Text"
# priority: P2
# description: On the first-launch language screen, selects English so the inline legal text renders in English, then verifies the language_legal_text TextView contains both the "Terms of Use" and "Privacy Policy" link labels. Also confirms that the language_start_button is visible (the screen is in its complete state).
# Same caveat as TC26 / TC27 — the embedded "Terms of Use" and
# "Privacy Policy" links are Compose AnnotatedString spans without
# their own accessibility nodes, so Maestro cannot reliably tap into
# them. The original "open dialog → close via back → reopen" scenario
# this test was supposed to cover is therefore reduced to a
# verification-only test: both link labels render in the legal text
# block, and the language screen's primary CTA (Start button) is
# present. Opening and closing the dialogs remains a manual
# checklist item until the app team exposes the links as separate
# nodes with testTags.
tags:
  - onboarding
  - legal
  - regression
---
- launchApp

- runFlow:
    when:
      visible:
        text: "Try again"
    commands:
      - tapOn: "Try again"

- extendedWaitUntil:
    visible:
      id: "language_screen"
    timeout: 30000

# Pick English so the legal text renders in the assertable language.
- extendedWaitUntil:
    visible:
      id: "language_item_${LANGUAGE_CODE}"
    timeout: 5000
- tapOn:
    id: "language_item_${LANGUAGE_CODE}"
- waitForAnimationToEnd

# Both legal links present in the rendered legal text.
- extendedWaitUntil:
    visible:
      id: "language_legal_text"
    timeout: 10000
- assertVisible:
    id: "language_legal_text"
- assertVisible:
    id: "language_terms_btn"
- assertVisible:
    id: "language_privacy_btn"

# Language screen is in a usable state — the primary CTA renders.
- assertVisible:
    id: "language_start_button"

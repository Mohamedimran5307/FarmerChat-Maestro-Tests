appId: ${APP_ID}
name: "TC16 - Help: FAQ Accordion Expands With Answer"
# priority: P2
# description: Validates the FAQ accordion in the Help screen: opens Help from the drawer, taps the first FAQ question, and confirms the accordion expands to reveal its associated answer body.
# TODO: faqs-en / faq-01 testTags carry over from the old APK and
# need a live-device confirmation on the new build. The FAQ
# question text ("What is FarmerChat...") and answer body may also
# have been edited — refresh both after the first inspection.
tags:
  - help
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_help_btn"
    timeout: 5000
- tapOn:
    id: "drawer_help_btn"
- extendedWaitUntil:
    visible:
      id: "help_screen"
    timeout: 5000

# Verify the Help section heading rendered, then expand the first FAQ.
- assertVisible: "How to use FarmerChat"
- tapOn: "What is FarmerChat and how can it help me?"

- extendedWaitUntil:
    visible:
      id: "faqs-en"
    timeout: 10000
- assertVisible:
    id: "faq-01"
- assertVisible: "FarmerChat gives you instant advice on crops, pests, diseases, weather, and livestock. It helps you farm better and save money."

appId: ${APP_ID}
name: "TC_32 - Photo Question from Camera → AI Response"
# priority: P2
# description: Verifies the photo-based chat flow via the device camera: taps the Photo input button, picks the Camera option, captures and accepts a photo, sends it as a chat question, and confirms an AI answer renders with its suggested-questions block.
# TODO: This test depends on the device's native camera UI
# (com.android.camera2 testTags are AOSP-specific). On the Redmi
# device under test the camera package may be different — e.g.
# com.android.camera or com.mi.android.camera. The shutter / done
# fallbacks below are best-effort; needs live-device verification.
tags:
  - chat
  - camera
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- tapOn:
    id: "primary_input_photo_btn"

# Pick the Camera tab in the picker
- extendedWaitUntil:
    visible:
      text: ".*[Cc]amera.*"
    timeout: 5000
- tapOn:
    text: ".*[Cc]amera.*"

# Tap shutter: prefer AOSP id, fall back to text matcher
- extendedWaitUntil:
    visible:
      id: "com.android.camera2:id/shutter_button"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: "com.android.camera2:id/shutter_button"
    commands:
      - tapOn:
          id: "com.android.camera2:id/shutter_button"
- runFlow:
    when:
      visible:
        text: ".*[Ss]hutter.*"
    commands:
      - tapOn:
          text: ".*[Ss]hutter.*"

# Accept the captured photo: AOSP done button or OK text
- extendedWaitUntil:
    visible:
      id: "com.android.camera2:id/done_button"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: "com.android.camera2:id/done_button"
    commands:
      - tapOn:
          id: "com.android.camera2:id/done_button"
- runFlow:
    when:
      visible:
        text: ".*OK.*"
    commands:
      - tapOn:
          text: ".*OK.*"

# Back in FarmerChat with the photo attached — send it
- extendedWaitUntil:
    visible:
      id: "chat_send_btn"
    timeout: 15000
- tapOn:
    id: "chat_send_btn"

# Wait for the answer to render (suggestions are the end-of-stream signal)
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 90000
    speed: 40
- assertVisible:
    id: "chat_suggested_questions"

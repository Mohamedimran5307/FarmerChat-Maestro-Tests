appId: ${APP_ID}
name: "TC_05 - Location-Based Personalization via Weather Widget"
# priority: P0
# description: Verifies location-based personalization end-to-end: taps the home weather widget, grants foreground location permission, waits for the AI-generated chat answer with suggested follow-up questions, and confirms a personalized content card renders on the home feed after returning home.
tags:
  - home
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- runFlow: ../../helpers/grant_location.yaml

# After granting location, the weather/location card opens a chat — scroll to its related-questions block
- scrollUntilVisible:
    centerElement: true
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 90000
    speed: 75   
- assertVisible:
    id: "chat_suggested_questions"

# Back to home and confirm a personalized feed card is rendered
- back
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 10000
- assertVisible:
    id: "content_card_start_chat_btn"

appId: ${APP_ID}
name: "TC24 - Location Interstitial: Skip Returns to Home"
# priority: P2
# description: Validates the Skip option on the location-share interstitial: taps the home weather widget to open the interstitial, taps Skip, and confirms the user is returned to the home screen without granting location.
# TODO: location_interstitial_skip is the OLD APK's id for the Skip
# button. On the new APK the Share-Location CTA is
# location_interstitial_cta_btn; the Skip button may be
# location_interstitial_btn_skip or rendered as text "No thanks" /
# "Skip" — needs a live-device check on the interstitial screen.
tags:
  - home
  - onboarding
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- tapOn:
    id: "home_weather_button"

- extendedWaitUntil:
    visible:
      id: "appbar_default_right_btn"
    timeout: 10000
- assertVisible:
    id: "appbar_default_right_btn"
- tapOn:
    id: "appbar_default_right_btn"

- back
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000
- assertVisible:
    id: "home_screen"

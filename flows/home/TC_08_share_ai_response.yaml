appId: org.digitalgreen.farmer.chat
name: "TC08 - Share AI Response via System Chooser"
# priority: P1
# description: Verifies the Share action on an AI answer: sends a typed question, waits for the answer to fully render (suggestions visible), taps the action-row Share button, and confirms that the Android share chooser opens.
# TODO: chat_share_btn lost its testTag on some builds of the new APK.
# If the lookup starts timing out, fall back to a text:"Share" matcher
# or escalate to the app team.
tags:
  - home
  - chat
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml
- runFlow:
    file: ../../helpers/compose_typed_question.yaml
    env:
      QUESTION_TEXT: "How to prevent maize rust disease"

# Wait for the answer-complete signal (suggestions block renders last).
- scrollUntilVisible:
    centerElement: false
    element:
      id: "chat_suggested_questions"
    direction: DOWN
    timeout: 90000
    speed: 40

# Scroll up to the action row to bring chat_share_btn into a tappable position.
- scrollUntilVisible:
    centerElement: true
    element:
      id: "chat_share_btn"
    direction: UP
    timeout: 10000
- tapOn:
    id: "chat_share_btn"

# Android share chooser opens.
- extendedWaitUntil:
    visible:
      id: "android:id/chooser_header"
    timeout: 15000
- assertVisible:
    id: "android:id/chooser_header"

appId: ${APP_ID}
name: "TC26 - First-Launch: Open Terms of Use from Language Screen"
# priority: P2
# description: Verifies the Terms of Use link on the first-launch language screen: on a fresh-install state, picks the configured language so the inline legal text renders, taps the Terms of Use link, and confirms the Terms document opens.
# Note: on this APK build the language_legal_text + Terms of Use /
# Privacy Policy links only become visible AFTER a language is
# selected from language_item_${LANGUAGE_CODE}. The original
# (old-APK) flow could tap the Terms link directly on the language
# screen — that no longer works. Doesn't run complete_onboarding —
# the runner's setup_test already wipes app state, so launchApp
# lands on the first-launch language screen directly.
tags:
  - onboarding
  - legal
  - regression
---
- launchApp

# Handle the "Try again" fallback if the language fetch fails initially.
- runFlow:
    when:
      visible:
        text: "Try again"
    commands:
      - tapOn: "Try again"

# Wait for the language screen to render.
- extendedWaitUntil:
    visible:
      id: "language_screen"
    timeout: 30000

# Pick the configured language so the inline legal-text block (with the
# Terms of Use link) renders. Wrapped in runFlow when: language_screen to
# stay a no-op on builds where this step doesn't apply.
- runFlow:
    when:
      visible:
        id: "language_screen"
    commands:
      - extendedWaitUntil:
          visible:
            id: "language_item_${LANGUAGE_CODE}"
          timeout: 5000
      - tapOn:
          id: "language_item_${LANGUAGE_CODE}"

# Tap the "Terms of Use" link once it animates in (the legal-text block
# appears after language selection). text-matcher used because the
# language_terms_link testTag from the old APK doesn't exist here.
- assertVisible:
    id: "language_legal_text"
- assertVisible:
    id: "language_terms_btn"
- tapOn:
    id: "language_terms_btn"

# Verify the Terms document opens. "Terms of Use" stays visible because
# it's typically also the title of the opened document.
- extendedWaitUntil:
    visible:
      text: "Terms of Use"
    timeout: 10000
- assertVisible:
    text: "Terms of Use"

appId: ${APP_ID}
name: "TC33 - Chat Send Offline: Inline Error + Retry Button"
# priority: P2
# description: Verifies the inline chat error when sending a question while offline: types and submits a question, then confirms an inline error message with an inline retry button appears inside the chat (not the global error screen). Precondition: TC34 onboarding has completed online, then the device was switched offline before this test runs.
# Precondition: device must be OFFLINE before this test runs (after
# the TC34_chat_error_onboarding step has put the app on home_screen
# while still online). The runner does not toggle airplane mode.
# Pairs with TC34_chat_error_recovery for the after-restore retry.
# TODO: chat_inline_error / chat_inline_retry_button testTags carry
# over from the old APK; the new build may use different ids.
tags:
  - chat
  - error
  - regression
---
- tapOn:
    id: "primary_input_type_btn"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "chat_text_input"
    timeout: 5000
- tapOn:
    id: "chat_text_input"
- inputText: "How to grow maize"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "chat_send_btn"
    timeout: 5000
- tapOn:
    id: "chat_send_btn"

- extendedWaitUntil:
    visible:
      id: "chat_inline_error"
    timeout: 60000
- assertVisible:
    id: "chat_inline_retry_button"

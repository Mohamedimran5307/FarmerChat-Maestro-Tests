appId: org.digitalgreen.farmer.chat
name: "TC22 - Sign Up + Logout via Settings"
# priority: P0
# requires: PHONE_NUMBER,OTP_CODE
# description: Complete auth lifecycle test: signs up via the drawer (phone + OTP), navigates to Settings, taps the auth entry (now showing Logout when signed in), and confirms the user is returned to the first-launch language screen as a fresh session.
tags:
  - settings
  - auth
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml
- runFlow: ../../helpers/full_signup.yaml

# ── Open drawer → Settings ──
# scrollUntilVisible on home_hamburger_button rides through any settling
# animation after the account-success → home_screen transition (the feed
# can settle in a collapsed state where hamburger is unmounted).
- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_settings_btn"
    timeout: 5000
- tapOn:
    id: "drawer_settings_btn"
- extendedWaitUntil:
    visible:
      id: "settings_screen"
    timeout: 5000

# ── Tap Logout in Settings (same testTag as Sign Up; text flips with auth state) ──
- tapOn:
    id: "settings_btn_auth"

# ── Assert navigated back to language screen ──
- extendedWaitUntil:
    visible:
      id: "language_screen"
    timeout: 15000

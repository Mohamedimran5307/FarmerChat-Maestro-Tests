appId: com.android.settings
name: "TC34 - Chat Error Offline"
tags:
  - chat
  - error
  - regression
---
- tapOn:
    id: "home_type_button"
- tapOn: "Ask about your farm..."
- inputText: "How to grow maize in Kenya"
- extendedWaitUntil:
    visible:
      id: "text_input_send_button"
    timeout: 5000
- tapOn:
    id: "text_input_send_button"

- extendedWaitUntil:
    visible:
      id: "chat_inline_error"
    timeout: 60000
- assertVisible:
    id: "chat_inline_retry_button"

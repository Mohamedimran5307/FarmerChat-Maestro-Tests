appId: ${APP_ID}
name: "TC09 - Answer Gender Profile-Prompt Card"
# priority: P2
# description: Finds the gender profile-prompt card, taps an option, and verifies the card dismisses afterwards
tags:
  - home
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- assertVisible:
    id: "home_screen"

# Scroll the feed until the gender profile-prompt card is visible.
# This card is Firebase-flag gated — if the flag is off the card never
# appears, so the test wraps the entire interaction in a `when: visible:`
# guard. When the card IS shown, we exercise the option-tap + dismiss
# behavior; when it isn't, the test is a no-op (the "did the card
# render at all" check belongs to TC09_home_input_type instead).
- runFlow:
    when:
      visible:
        id: "home_feed_card_gender"
    commands:
      - scrollUntilVisible:
          centerElement: true
          element:
            id: "home_feed_card_gender"
          direction: DOWN
          timeout: 30000
          speed: 40
      - assertVisible:
          id: "single_select_card_option_0"
      - tapOn:
          id: "single_select_card_option_0"
      - waitForAnimationToEnd
      # Cards typically auto-dismiss once an option is picked. If this
      # build adds a Save/Confirm step, this assertion will time out
      # and the next step needs to be added — see TC15 for the
      # signup-skip "Save" pattern.
      - extendedWaitUntil:
          notVisible:
            id: "home_feed_card_gender"
          timeout: 10000

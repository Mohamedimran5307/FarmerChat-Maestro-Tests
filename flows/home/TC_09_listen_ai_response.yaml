appId: org.digitalgreen.farmer.chat
name: "TC09 - Listen to AI Response (TTS Playback)"
# priority: P0
# description: Validates the text-to-speech playback control on AI answers: sends a typed question, waits for the answer with its action row, taps Listen, waits through the TTS engine's loading state, and confirms the button transitions Listen → Pause on first tap and Pause → Play on second tap.
# requires: LANGUAGE_CODE=en
tags:
  - home
  - chat
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml
- runFlow:
    file: ../../helpers/compose_typed_question.yaml
    env:
      QUESTION_TEXT: "What are common tomato diseases"

# scrollUntilVisible waits up to 90s for chat_listen_btn, which appears
# only after the answer finishes streaming.
- scrollUntilVisible:
    centerElement: true
    element:
      id: "chat_listen_btn"
    direction: DOWN
    timeout: 90000

# State machine: Listen (idle) → Loading… → Pause (playing) → Play (paused).
# Each label is the accessibilityText on the icon inside chat_listen_btn;
# Maestro's text: matcher also reads a11y labels. Labels are English-only —
# TC09 is bound to LANGUAGE_CODE=en via config/env.yaml.
- assertVisible:
    text: "Listen"

# Start playback. The TTS engine fetches / initializes audio on the
# first tap and shows a "Loading..." state in chat_listen_btn before
# transitioning to Pause. On a cold engine this can take 20-40s, well
# past the old 3s+5s budget — gate explicitly on "Loading..." going
# away.
- tapOn:
    id: "chat_listen_btn"
- extendedWaitUntil:
    notVisible:
      text: "Loading..."
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: "Pause"
    timeout: 5000

# Pause playback. State should flip to "Play" (resumable). The engine
# is already warm at this point so no Loading... state to gate on.
- tapOn:
    id: "chat_listen_btn"
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible:
      text: "Play"
    timeout: 5000
- assertVisible:
    id: "chat_screen"

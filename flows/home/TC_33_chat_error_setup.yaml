appId: ${APP_ID}
name: "TC33 - Onboard to Home (Offline-Error Setup)"
# priority: P2
# description: Setup step for the TC33 offline-error sequence: completes onboarding while online and lands on the home screen so the operator can disable network before running the offline-send test.
# Precondition: device ONLINE while this runs. Sequence:
#   1) Run THIS test (lands on home_screen).
#   2) Disable network on device.
#   3) Run TC_31_chat_error_offline (verifies inline error appears).
#   4) Re-enable network.
#   5) Run TC_32_chat_error_recovery (verifies retry recovers).
tags:
  - chat
  - error
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml
- assertVisible:
    id: "home_screen"

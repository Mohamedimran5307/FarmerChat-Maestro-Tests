appId: ${APP_ID}
name: "TC16 - Help: Open Terms of Use"
# priority: P2
# description: Verifies the Terms of Use entry in the Help screen: opens Help from the drawer, taps the Terms of Use entry, and confirms the legal document loads.
# TODO: help_terms_of_use testTag carries over from the old APK and
# needs a live-device confirmation on the new build. May now be
# help_btn_terms or similar.
tags:
  - help
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_help_btn"
    timeout: 5000
- tapOn:
    id: "drawer_help_btn"
- extendedWaitUntil:
    visible:
      id: "help_screen"
    timeout: 5000

- tapOn:
    id: "help_terms_of_use"

- extendedWaitUntil:
    visible:
      text: "Terms of Use"
    timeout: 15000
- assertVisible:
    text: "Terms of Use"

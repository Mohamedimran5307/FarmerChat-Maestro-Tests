appId: ${APP_ID}
name: "TC13 - Settings → Update Display Name"
# priority: P2
# description: Edits the display name from Settings and verifies the new value appears on the settings screen
# TODO: The name-edit sub-screen testTags (settings_name_screen,
# settings_name_input, settings_name_save_button) carry over from
# the old APK and have NOT been re-inspected on the new APK. Drive
# through this flow live and update the ids to whatever the new
# build emits (e.g. settings_name_input_field, settings_btn_name_save).
tags:
  - settings
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_settings_btn"
    timeout: 5000
- tapOn:
    id: "drawer_settings_btn"
- extendedWaitUntil:
    visible:
      id: "settings_screen"
    timeout: 5000

# Tap the name-edit row. Per the testTag map in CLAUDE.md the row's
# id is settings_name_edit_row on the new APK.
- tapOn:
    id: "settings_name_edit_row"
- extendedWaitUntil:
    visible:
      id: "settings_name_screen"
    timeout: 5000

# Clear and replace the existing name. The longPress + Select all
# combo handles cases where eraseText alone doesn't drain the field
# (some IMEs ignore the eraseText event count).
- tapOn:
    id: "settings_name_input"
- longPressOn:
    id: "settings_name_input"
- runFlow:
    when:
      visible:
        text: "Select all"
    commands:
      - tapOn: "Select all"
- eraseText: 1
- inputText: "Kenya Farmer"
- hideKeyboard
- tapOn:
    id: "settings_name_save_button"

- extendedWaitUntil:
    visible:
      id: "settings_screen"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: ".*Kenya Farmer.*"
    timeout: 10000

appId: ${APP_ID}
name: "TC35 - Chat History: Retry After Reconnect Loads History"
# priority: P2
# description: Taps Retry on the global no-internet error after network is restored and verifies the Chat History list renders with the seeded conversation
# Precondition: network connectivity must be RESTORED and the
# device must be showing the global error screen from
# TC35_chat_history_retry_assert. See setup for the full sequence.
tags:
  - chat
  - error
  - regression
---
- tapOn:
    id: "error_retry_button"

# Retry may land on home OR directly on Chat History depending on
# where the navigation stack came from. Handle both.
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: "home_screen"
    commands:
      - tapOn:
          id: "home_hamburger_button"
      - extendedWaitUntil:
          visible:
            id: "drawer_see_all_button"
          timeout: 5000
      - tapOn:
          id: "drawer_see_all_button"

- extendedWaitUntil:
    visible:
      id: "chat_history_screen"
    timeout: 15000
- assertVisible:
    id: "chat_history_list"
- assertVisible:
    text: ".*wheat.*"

appId: ${APP_ID}
name: "TC27 - Location Interstitial: Skip Returns to Home"
# priority: P2
# description: Taps the weather widget to open the location interstitial, taps Skip, and verifies the user is back on home
# TODO: location_interstitial_skip is the OLD APK's id for the Skip
# button. On the new APK the Share-Location CTA is
# location_interstitial_cta_btn; the Skip button may be
# location_interstitial_btn_skip or rendered as text "No thanks" /
# "Skip" — needs a live-device check on the interstitial screen.
tags:
  - home
  - onboarding
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- tapOn:
    id: "home_weather_button"

- extendedWaitUntil:
    visible:
      id: "location_interstitial_skip"
    timeout: 10000
- assertVisible:
    id: "location_interstitial_skip"
- tapOn:
    id: "location_interstitial_skip"

- back
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000
- assertVisible:
    id: "home_screen"

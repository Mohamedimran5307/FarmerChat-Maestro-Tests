appId: com.android.settings
name: "TC25 - Login with Phone Number and OTP"
tags:
  - auth
  - regression
---
- runFlow: ../../helpers/complete_onboarding.yaml

- tapOn:
    id: "home_hamburger_button"
- extendedWaitUntil:
    visible:
      id: "drawer_signup_button"
    timeout: 5000
- tapOn:
    id: "drawer_signup_button"

- extendedWaitUntil:
    visible:
      text: "Sign up with phone number"
    timeout: 10000
- tapOn: "Sign up with phone number"

# Enter phone number
- extendedWaitUntil:
    visible:
      id: "auth_phone_input"
    timeout: 10000
- tapOn:
    id: "auth_phone_input"
- inputText: "7013733824"
- tapOn: "Send via SMS"

# Enter OTP
- extendedWaitUntil:
    visible:
      id: "auth_otp_input"
    timeout: 30000
- tapOn:
    id: "auth_otp_input"
- inputText: "1111"
- tapOn:
    id: "auth_submit_button"

# Assert success screen
- extendedWaitUntil:
    visible:
      id: "account_success_screen"
    timeout: 30000
- assertVisible: ".*all set.*"

# Tap Continue and land on home
- tapOn:
    id: "account_success_continue"
- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 15000

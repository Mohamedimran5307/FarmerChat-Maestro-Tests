appId: ${APP_ID}
name: "TC_16 - Drawer → Sign Up: Phone-Input Screen"
# priority: P1
# description: Verifies the sign-up entry point from the drawer: taps the drawer Sign Up entry, traverses the optional account-benefits intermediate screen, and confirms the phone-input screen appears.
tags:
  - navigation
  - auth
  - regression
---
- launchApp
- runFlow: ../../helpers/complete_onboarding.yaml

- scrollUntilVisible:
    centerElement: false
    element:
      id: "home_hamburger_button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "home_hamburger_button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "drawer_signup_btn"
    timeout: 5000
- tapOn:
    id: "drawer_signup_btn"

# Some builds insert an intermediate "account benefits" screen.
- runFlow:
    when:
      visible:
        id: "account_benefits_btn_signup"
    commands:
      - tapOn:
          id: "account_benefits_btn_signup"

- extendedWaitUntil:
    visible:
      id: "auth_screen"
    timeout: 10000
- assertVisible:
    id: "auth_phone_input"

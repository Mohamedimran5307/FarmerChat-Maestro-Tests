name: FarmerChat Maestro Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  APP_ID: org.digitalgreen.farmer.chat

jobs:
  maestro-tests:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS files
        run: |
          git lfs install
          git lfs pull

      - name: Ensure emulator is running
        run: |
          if ! adb devices | grep -q "emulator-5554"; then
            echo "Starting emulator..."
            emulator -avd Pixel_7_Pro -no-audio -no-boot-anim &
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 2; done;'
            sleep 10
          else
            echo "Emulator already running."
          fi

      - name: Verify connectivity
        run: |
          adb shell "ping -c 2 -W 3 8.8.8.8" || echo "WARNING: ping failed"
          echo "Connectivity check done."

      - name: Install APK
        run: |
          adb install -r app.apk || { echo "APK install failed!"; exit 1; }

      - name: Configure device
        run: |
          adb shell pm grant ${{ env.APP_ID }} android.permission.ACCESS_FINE_LOCATION 2>/dev/null || true
          adb shell pm grant ${{ env.APP_ID }} android.permission.ACCESS_COARSE_LOCATION 2>/dev/null || true
          adb shell pm grant ${{ env.APP_ID }} android.permission.CAMERA 2>/dev/null || true
          adb shell pm grant ${{ env.APP_ID }} android.permission.RECORD_AUDIO 2>/dev/null || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put secure stylus_handwriting_enabled 0 2>/dev/null || true
          adb shell settings put secure show_stylus_handwriting_intro 0 2>/dev/null || true
          adb forward tcp:7001 tcp:7001

      - name: Ensure Maestro CLI
        run: |
          if ! command -v maestro &>/dev/null; then
            curl -Ls "https://get.maestro.mobile.dev" | bash
            echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          else
            echo "Maestro already installed: $(maestro --version)"
          fi

      - name: Run test suite
        run: |
          chmod +x scripts/run_all.sh
          bash scripts/run_all.sh

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-report-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: Upload Maestro Debug Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-logs-${{ github.run_number }}
          path: ~/.maestro/tests/
          retention-days: 7

      - name: Post Summary
        if: always()
        run: |
          REPORT_DIR=$(ls -td reports/*/ 2>/dev/null | head -1)
          if [ -n "$REPORT_DIR" ]; then
            PASSED=$(grep -c 'badge passed' "$REPORT_DIR/report.html" || echo 0)
            FAILED=$(grep -c 'badge failed' "$REPORT_DIR/report.html" || echo 0)
            TOTAL=$((PASSED + FAILED))
            echo "## Maestro Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Tests | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$FAILED" -eq 0 ]; then
              echo "> All tests passed!" >> $GITHUB_STEP_SUMMARY
            else
              echo "> $FAILED test(s) failed. Check the uploaded report for details." >> $GITHUB_STEP_SUMMARY
            fi
          fi

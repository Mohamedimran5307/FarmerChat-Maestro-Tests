name: FarmerChat Maestro Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  APP_ID: org.digitalgreen.farmer.chat

jobs:
  maestro-tests:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-34" \
            "system-images;android-34;google_apis;arm64-v8a" || true

      - name: Create and Boot Emulator
        run: |
          echo "Creating AVD..."
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
            -n test_avd \
            -k "system-images;android-34;google_apis;arm64-v8a" \
            -d "pixel_6" \
            --force

          echo "Starting emulator..."
          $ANDROID_HOME/emulator/emulator -avd test_avd \
            -no-window -noaudio -no-boot-anim -no-snapshot \
            -dns-server 8.8.8.8 &

          echo "Waiting for emulator to boot..."
          adb wait-for-device
          boot=""
          timeout=300
          elapsed=0
          while [ "$boot" != "1" ] && [ $elapsed -lt $timeout ]; do
            boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            sleep 5
            elapsed=$((elapsed + 5))
            echo "  Waiting... ${elapsed}s"
          done

          if [ "$boot" != "1" ]; then
            echo "Emulator failed to boot in ${timeout}s"
            adb devices
            exit 1
          fi

          echo "Emulator booted in ${elapsed}s"
          adb devices
          sleep 10

      - name: Install APK and configure
        run: |
          echo "Installing APK..."
          adb install -r app.apk || { echo "APK install failed!"; exit 1; }

          echo "Granting permissions..."
          adb shell pm grant $APP_ID android.permission.ACCESS_FINE_LOCATION 2>/dev/null || true
          adb shell pm grant $APP_ID android.permission.ACCESS_COARSE_LOCATION 2>/dev/null || true
          adb shell pm grant $APP_ID android.permission.CAMERA 2>/dev/null || true
          adb shell pm grant $APP_ID android.permission.RECORD_AUDIO 2>/dev/null || true
          adb shell pm grant $APP_ID android.permission.POST_NOTIFICATIONS 2>/dev/null || true

          echo "Disabling animations..."
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put secure stylus_handwriting_enabled 0 2>/dev/null || true
          adb shell settings put secure show_stylus_handwriting_intro 0 2>/dev/null || true

          adb forward tcp:7001 tcp:7001
          echo "Device ready."

      - name: Run Maestro Tests
        run: |
          chmod +x scripts/run_all.sh
          bash scripts/run_all.sh

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-report-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: Upload Maestro Debug Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-logs-${{ github.run_number }}
          path: ~/.maestro/tests/
          retention-days: 7

      - name: Post Summary
        if: always()
        run: |
          REPORT_DIR=$(ls -td reports/*/ 2>/dev/null | head -1)
          if [ -n "$REPORT_DIR" ]; then
            PASSED=$(grep -c 'badge passed' "$REPORT_DIR/report.html" || echo 0)
            FAILED=$(grep -c 'badge failed' "$REPORT_DIR/report.html" || echo 0)
            TOTAL=$((PASSED + FAILED))
            echo "## Maestro Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Tests | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$FAILED" -eq 0 ]; then
              echo "> All tests passed!" >> $GITHUB_STEP_SUMMARY
            else
              echo "> $FAILED test(s) failed. Check the uploaded report for details." >> $GITHUB_STEP_SUMMARY
            fi
          fi

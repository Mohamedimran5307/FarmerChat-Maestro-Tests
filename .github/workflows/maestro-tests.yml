name: FarmerChat Maestro Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  APP_ID: org.digitalgreen.farmer.chat

# Needed for the publish-report job to deploy the HTML report to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run supersede an in-flight Pages deploy rather than fail it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  maestro-tests:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS files
        run: |
          git lfs install
          git lfs pull

      - name: Ensure a test device (physical preferred)
        run: |
          set -e
          # Resolve the SDK; bare `emulator` on PATH resolves to a wrong relative
          # path and fails with "Qt library not found" — always use the absolute
          # $ANDROID_HOME/emulator/emulator, which locates its own bundled libs.
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          EMU="$ANDROID_HOME/emulator/emulator"
          ADB="$ANDROID_HOME/platform-tools/adb"
          echo "ANDROID_HOME=$ANDROID_HOME"

          # Prefer a physical device if one is attached (id NOT starting with
          # "emulator-"). Only spin up an emulator when none is present.
          PHYS="$("$ADB" devices | awk 'NR>1 && $2=="device" && $1 !~ /^emulator-/ {print $1; exit}')"
          if [ -n "$PHYS" ]; then
            echo "Physical device attached ($PHYS) — using it; skipping emulator."
            echo "MAESTRO_DEVICE=$PHYS" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "No physical device attached — bringing up an emulator."

          if "$ADB" devices | grep -q "emulator-5554"; then
            echo "Emulator already running."
          else
            # Reuse an existing AVD if present, else create a headless one.
            AVD="$("$EMU" -list-avds 2>/dev/null | head -1 || true)"
            if [ -z "$AVD" ]; then
              AVD="ci_emulator"
              IMG="system-images;android-34;google_apis;arm64-v8a"
              SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
              AVDMGR="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
              echo "No AVD found — creating '$AVD'"
              yes | "$SDKMGR" "platform-tools" "emulator" "$IMG" >/dev/null
              echo "no" | "$AVDMGR" create avd -n "$AVD" -k "$IMG" --device "pixel_7" --force
            fi
            echo "Booting AVD: $AVD"
            # Launch from the emulator dir so Qt/qemu libs resolve; headless flags.
            ( cd "$ANDROID_HOME/emulator" && \
              ./emulator -avd "$AVD" -no-window -no-audio -no-boot-anim -no-snapshot \
                -gpu swiftshader_indirect -netdelay none -netspeed full \
                >/tmp/emulator_boot.log 2>&1 & )
            "$ADB" -s emulator-5554 wait-for-device
            echo "Waiting for boot to complete..."
            for i in $(seq 1 60); do
              [ "$("$ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
              sleep 5
            done
            "$ADB" -s emulator-5554 shell input keyevent 82 >/dev/null 2>&1 || true
            echo "Emulator booted."
          fi

          # Reached only when no physical device was attached — target the emulator.
          echo "MAESTRO_DEVICE=emulator-5554" >> "$GITHUB_ENV"

      - name: Verify connectivity
        run: |
          adb -s "$MAESTRO_DEVICE" shell "ping -c 2 -W 3 8.8.8.8" || echo "WARNING: ping failed"
          echo "Connectivity check done."

      - name: Install APK
        run: |
          if adb -s "$MAESTRO_DEVICE" shell pm list packages | grep -q "${{ env.APP_ID }}"; then
            echo "App already installed, reinstalling from repo..."
          fi
          adb -s "$MAESTRO_DEVICE" install -r app.apk || {
            echo "APK install from repo failed, checking if app exists on device..."
            if adb -s "$MAESTRO_DEVICE" shell pm list packages | grep -q "${{ env.APP_ID }}"; then
              echo "App already installed on device, continuing."
            else
              echo "APK install failed and app not on device!"
              exit 1
            fi
          }

      - name: Configure device
        run: |
          D="$MAESTRO_DEVICE"
          adb -s "$D" shell pm grant ${{ env.APP_ID }} android.permission.ACCESS_FINE_LOCATION 2>/dev/null || true
          adb -s "$D" shell pm grant ${{ env.APP_ID }} android.permission.ACCESS_COARSE_LOCATION 2>/dev/null || true
          adb -s "$D" shell pm grant ${{ env.APP_ID }} android.permission.CAMERA 2>/dev/null || true
          adb -s "$D" shell pm grant ${{ env.APP_ID }} android.permission.RECORD_AUDIO 2>/dev/null || true
          adb -s "$D" shell settings put global window_animation_scale 0
          adb -s "$D" shell settings put global transition_animation_scale 0
          adb -s "$D" shell settings put global animator_duration_scale 0
          adb -s "$D" shell settings put secure stylus_handwriting_enabled 0 2>/dev/null || true
          adb -s "$D" shell settings put secure show_stylus_handwriting_intro 0 2>/dev/null || true
          adb -s "$D" forward tcp:7001 tcp:7001

      - name: Ensure Maestro CLI
        run: |
          if ! command -v maestro &>/dev/null; then
            curl -Ls "https://get.maestro.mobile.dev" | bash
            echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          else
            echo "Maestro already installed: $(maestro --version)"
          fi

      # Write the gitignored secrets file from repo Secrets so sign-up tests
      # (# requires: PHONE_NUMBER,OTP_CODE) can run. If the secrets aren't set,
      # the file isn't written and those tests skip cleanly.
      - name: Write local secrets
        env:
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          NEW_PHONE_NUMBER: ${{ secrets.NEW_PHONE_NUMBER }}
          OTP_CODE: ${{ secrets.OTP_CODE }}
        run: |
          if [ -n "$PHONE_NUMBER" ] && [ -n "$OTP_CODE" ]; then
            {
              echo "PHONE_NUMBER: $PHONE_NUMBER"
              echo "NEW_PHONE_NUMBER: ${NEW_PHONE_NUMBER:-$PHONE_NUMBER}"
              echo "OTP_CODE: $OTP_CODE"
            } > config/env.local.yaml
            echo "Wrote config/env.local.yaml from repo secrets — sign-up tests will run."
          else
            echo "PHONE_NUMBER/OTP_CODE secrets not set — sign-up tests will skip."
          fi

      - name: Run test suite
        run: |
          chmod +x run_tests.sh
          ./run_tests.sh "CI"

      - name: Remove local secrets
        if: always()
        run: rm -f config/env.local.yaml

      # Backstop: on cancel the runner can orphan run_tests.sh (reparented to
      # init) without signalling it, so its trap never fires and it keeps
      # looping — respawning maestro on the attached device. Kill the SPAWNER
      # (run_tests.sh) first, then its maestro child + on-device driver.
      # always() runs this even when the job is cancelled.
      - name: Kill stray Maestro processes
        if: always()
        run: |
          pkill -9 -f 'run_tests.sh' 2>/dev/null || true
          sleep 1
          pkill -9 -f 'maestro.cli.AppKt' 2>/dev/null || true
          pkill -9 -f 'am instrument.*dev.mobile.maestro' 2>/dev/null || true
          for d in $(adb devices | awk 'NR>1 && $2=="device"{print $1}'); do
            adb -s "$d" shell am force-stop dev.mobile.maestro.test 2>/dev/null || true
            adb -s "$d" shell am force-stop dev.mobile.maestro 2>/dev/null || true
            adb -s "$d" shell pkill -SIGINT screenrecord 2>/dev/null || true
          done
          echo "Stray Maestro cleanup done."

      # Focused artifact: just the JSON + HTML summary reports, easy to grab.
      - name: Upload JSON + HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FarmerChat-report-${{ github.run_number }}
          path: |
            reports/FarmerChat_TestReport_*.json
            reports/FarmerChat_TestReport_*.html
          retention-days: 30
          if-no-files-found: warn

      # Full bundle: the same reports plus per-test logs, screenshots and videos
      # (the HTML links to these, so download this one to view media inline).
      - name: Upload full report bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FarmerChat-report-full-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Maestro Debug Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-logs-${{ github.run_number }}
          path: ~/.maestro/tests/
          retention-days: 7

      - name: Post Summary
        if: always()
        run: |
          REPORT_JSON=$(ls -t reports/FarmerChat_TestReport_*.json 2>/dev/null | head -1)
          if [ -n "$REPORT_JSON" ]; then
            TOTAL=$(grep -oE '"total"[: ]+[0-9]+' "$REPORT_JSON" | grep -oE '[0-9]+' | head -1)
            PASSED=$(grep -oE '"passed"[: ]+[0-9]+' "$REPORT_JSON" | grep -oE '[0-9]+' | head -1)
            FAILED=$(grep -oE '"failed"[: ]+[0-9]+' "$REPORT_JSON" | grep -oE '[0-9]+' | head -1)
            TOTAL=${TOTAL:-0}; PASSED=${PASSED:-0}; FAILED=${FAILED:-0}
            echo "## Maestro Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Tests | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$FAILED" -eq 0 ]; then
              echo "> All tests passed!" >> $GITHUB_STEP_SUMMARY
            else
              echo "> $FAILED test(s) failed. Check the uploaded report for details." >> $GITHUB_STEP_SUMMARY
            fi
            REPORT_HTML=$(ls -t reports/FarmerChat_TestReport_*.html 2>/dev/null | head -1)
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Reports** (download from the run's *Artifacts* section):" >> $GITHUB_STEP_SUMMARY
            echo "- JSON: \`$(basename "$REPORT_JSON")\`" >> $GITHUB_STEP_SUMMARY
            echo "- HTML: \`$(basename "${REPORT_HTML:-n/a}")\`" >> $GITHUB_STEP_SUMMARY
            echo "  - \`FarmerChat-report-${{ github.run_number }}\` — JSON + HTML only" >> $GITHUB_STEP_SUMMARY
            echo "  - \`FarmerChat-report-full-${{ github.run_number }}\` — reports + logs/screenshots/videos" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Maestro Test Results" >> $GITHUB_STEP_SUMMARY
            echo "> No report generated (run may have failed before tests ran)." >> $GITHUB_STEP_SUMMARY
          fi

  # Publish the HTML report to GitHub Pages → a clickable URL per run. Runs on a
  # GitHub-hosted runner (Pages tooling + doesn't tie up the self-hosted Mac),
  # consuming the report bundle uploaded by maestro-tests.
  publish-report:
    needs: maestro-tests
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download report bundle
        uses: actions/download-artifact@v4
        with:
          name: FarmerChat-report-full-${{ github.run_number }}
          path: site
        continue-on-error: true

      - name: Prepare site (latest report as index.html)
        run: |
          mkdir -p site
          latest=$(ls -t site/FarmerChat_TestReport_*.html 2>/dev/null | head -1)
          if [ -n "$latest" ]; then
            cp "$latest" site/index.html
            echo "Published $(basename "$latest") as index.html"
          else
            echo "<h1>No FarmerChat report for run #${{ github.run_number }}</h1><p>The run produced no HTML report (it may have failed before tests ran).</p>" > site/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
